appId: com.officedesk.assistant
productName: Office Desk Assistant
copyright: Copyright © 2026 Office Desk Assistant
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - electron/**/*
  - server.ts
  - src/server/**/*
  - src/types.ts
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Office-Desk-Assistant-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: دستیار دفتر
