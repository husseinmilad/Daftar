name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'electron/**'
      - 'server.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'electron-builder.yml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installers and portable EXE
        run: npm run electron:build

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error
          retention-days: 30
